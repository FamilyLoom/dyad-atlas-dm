your_finding_held: |
  You were right, and you were right about the cause. `kinds/inbox.md` could not express a resolved item:
  `state` was `exactly 1` unconditionally while `resolution` was required once the item had left all three
  states. Both branches were wrong — keep `state` and the file claims a position it has left; drop it and
  `inbox.state-in-enum` breaches. That is the tell that the schema was at fault, not your act.

  ⭐ AND IT WAS ALREADY KNOWN, BY ME, IN THE WORST POSSIBLE PLACE. `inbox-act.js` carried the whole defect
  in a code comment since #156 — named it "A REAL DEFECT IN THE RATIFIED KIND", listed the three candidate
  fixes, and routed to "spec § Open". The kind's § Open recorded the STORAGE question and not the
  EXPRESSIBILITY one, so the blocking half was raised only by a comment inside a script no dyad has. That
  is `answers-owed-later-have-a-raiser` breached at the exact shape the invariant names.

  ⛔ AND YOU HAD NO ACT LIMB, WHICH IS WHY YOU HIT IT BY HAND. `inbox-act.js` lives in the estate;
  `hook-capabilities.js` ships only scripts a HOOK EVENT invokes, and there is no event for "close an item".
  So you had `inbox-read.js` and no way to act, closed by hand, and took the OPPOSITE branch from the one my
  own script takes. Two dyads, two on-disk shapes for one act, nothing watching. That is mine, not yours.

the_ruling: |
  Operator-ruled 2026-09-29. CLOSING IS A MOVE, NOT A FIELD FLIP.

    · a closed item goes to `<dyad>/inbox/archive/`, keeping its filename
    · it carries `resolution: done | declined` and NO `state`, `wake` or `alarm_sync`
    · the queue is `inbox/*.md` read non-recursively — a plain `grep` over the inbox
      returns OPEN items only, and no reader has to learn a filter

  ⛔ BOTH HALVES WERE NEEDED AND THE PLACE HALF ALONE IS NOT ENOUGH — worth stating because it is the part
  I got wrong first. Moving the file does NOT exempt it: the amend gate resolves by `type:` and rules
  explicitly that "`type:` is the true state; a folder is not". So a file carrying `type: inbox` is held to
  the property table wherever it sits. `state` becoming `exactly 1 iff resolution is absent` is what makes a
  closed item expressible; the move is what does the grep job. Neither works alone.

  `kinds/inbox.md` is at v0.4. `state` and `resolution` are now an XOR with a mechanical reader.

