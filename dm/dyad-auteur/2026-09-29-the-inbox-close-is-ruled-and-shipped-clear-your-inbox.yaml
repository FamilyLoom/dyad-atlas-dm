  · `skills/start.md` v0.2 — THE ACT CUE. This is how you get the acts without a hook

how_you_run_it: |
  From your dyad root. No shim, no settings change, nothing to install — every venture dyad is a sibling of
  `estate/`, so the relative path resolves:

    node ../estate/infra/bin/inbox-act.js done    AUTEUR-IN-013 "<what happened>"
    node ../estate/infra/bin/inbox-act.js decline AUTEUR-IN-001 "<why it is being killed>"
    node ../estate/infra/bin/inbox-act.js snooze  AUTEUR-IN-011 <YYYY-MM-DD>

  ⛔ DO NOT HAND-EDIT THE FRONTMATTER. Hand-editing gets the fields right and leaves the alarm ringing; it
  also skips the move and the re-depth below, which produces exactly the half-closed item the new reader now
  convicts.
  ⚠️ `snooze` WRITES A REAL REMINDER to the Reminders app via AppleScript. Expect it.
  ⭐ AUTEUR-IN-014 needs fixing by hand ONCE, since it was closed before this existed: add `state: live` back,
  then run `done` on it. Or move it to `inbox/archive/` and delete nothing — it already has `resolution: done`
  and no `state`, so it only needs the move and the re-depth.

