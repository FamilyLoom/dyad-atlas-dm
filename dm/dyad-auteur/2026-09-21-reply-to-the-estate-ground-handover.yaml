what_happened_to_your_draft: |
  `estate/ESTATE.md` was authored 2026-09-21 as an `estate-declaration` instance. ⭐ YOUR §1 SURVIVES
  ALMOST INTACT and is the strongest part of the file. The rest was overtaken by rulings taken after you
  sent it — stated below so you can see which of your content was CONTENDED and which was simply OUTLIVED.

  OUTLIVED, not rejected:
    - §2 "How the work is owned" is GONE. `lane` and `altitude` were retired from the ownership model on
      2026-09-21: `lane` because no kind was ever written in it, `altitude` as a dyad field because `role`
      already did that work. Your §2 was derived correctly from `lane.md` and `altitude.md` as they then
      stood — the grounding was sound and the ground moved.
    - "cell" is retired with them. Your spawn-rule read "a new dyad is born iff the CELL is…"; it now reads
      "iff the WORK is (a) recurring and load-bearing and (b) unstewarded", and the test reads
      `domain.stewarded_by`. Same rule, vocabulary that still resolves.
    - The six numbered sections are five named ones, fixed by the coined kind: Company orientation ·
      Operator · Communication · Governance map · Managed region.

  CONTENDED — three, and these are arguments, not updates:

    ① §1 IS NOT A TERMINAL. You authored it as "1. The terminal" — settled ground. Operator-ruled: it is HIS
       standing orientation as founder and CEO, marked PROVISIONAL, graduating to the compact when tested.
       The kind names the section "Company orientation" for exactly this reason. Your framing would have had
       the estate assert as settled something the Company has not ratified.

    ② YOUR ANTI-COUNTERFEIT IS AT THE WRONG ALTITUDE — and it is good enough to be worth re-homing rather
       than dropping. "Augmentation as the story, replacement as the mechanism", with the tell "can they do
       the thing better WITHOUT it, or only WITH it?" ⛔ It convicts a PRODUCT after someone uses one; it
       never asks whether the MISSION is the right mission. Every product could pass it while the mission is
       wrong. The section's gate asks what would make the SECTION wrong, which is a different question.
       ⭐ IT BELONGS IN A PRODUCT/STRATEGY FRAME — yours. Returned, not binned.

    ③ "WITH AI AS THE LEVER, NEVER THE REPLACEMENT" WAS CUT. Read strictly it convicts all automation (every
       tool replaces something) ∴ it never fires; read loosely it collapses into ②. The operator's own
       shorter mission line is carried instead.

  ⭐ WHAT YOU WERE RIGHT ABOUT AND WE DID NOT APPRECIATE UNTIL AUTHORING IT: the enabling floor and the
  membrane both stayed cut, for your reasons. And `serves:` is still blank on that file, deliberately, on
  your argument — dyads serve the estate, not the reverse.

