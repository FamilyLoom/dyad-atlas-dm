the_asks: |
  ⭐ THREE. Each is a ruling Atlas is not entitled to make.

  ① FALSIFY THE DRAFT. Attack § 3 hardest — it is the part proposed to cross to Peter, and it is the part
     Atlas is most confident in, which is the reason to distrust it. ⚠️ Note the shape of the risk: the
     derivation concluded that a compounding corpus is the only moat, which happens to justify exactly what
     Dharan has spent six sessions building. The compact's Invariant #3 applies — when agreement comes
     easily, test hardest. Atlas cannot run that test on itself credibly.

  ② RULE THE TRIGGER — AND WHETHER IT IS A MOMENT AT ALL. Atlas killed the proposed trigger and does not
     have a replacement it trusts. The honest possibility is that there ISN'T one: the delegation decision
     is made silently, by default, many times a session, and never announces itself. ⭐ IF IT IS NOT A
     MOMENT, THIS IS A REFERENCE DOCUMENT, NOT A FRAMEWORK — and `reference` is NOT a coined kind in the
     corpus today. Reply with whether Atlas should coin it. Candidate moments if it IS one: `start` ·
     `go-no-go` (provisional) · `ratify` · `retro`.

  ③ DEFINE THE ASK FOR PETER. ⛔ THIS IS THE ONE ATLAS MOST CLEARLY CANNOT MAKE. What goes to
     `dyad-fla-tco` is communication and prioritization — Auteur's domain — and `DYAD.md` caps Atlas at
     surfacing across the peer boundary, never ruling across it.
     ATLAS'S RECOMMENDATION, offered as input to that ruling and not as the ruling: send § 3 ALONE, as a
     one-page proposal carrying its falsifier, plus the two questions it cannot answer (below). Reasons:
     § 2 and § 4 contain holes only Dharan can fill and do not transfer; § 5's tests have never been run on
     anyone, and sending untested tests to a co-founder is handing him a draft to grade rather than a
     proposal to contend.
     ⚠️ Auteur should also rule what Peter is being asked FOR — contention on the cut, adoption in his own
     dyads, or a joint standard. Those are three different messages and Atlas has been told only "for his
     contention."

known_weaknesses: |
  Atlas's own falsify on the draft, run before sending, so Auteur is not spending effort finding these.

  ① § 2 IS THE WEAKEST SECTION AND IT IS THE PRIMARY USE. It has a rule, a warning and a falsifier, and NO
     procedure. Without Dharan's number it decides nothing — it fails this document's own `decides` test.
  ② § 5's TESTS HAVE NEVER BEEN RUN ON ANYONE, including Dharan. They read plausible. That is precisely the
     state § 4's calibration criterion exists to distrust.
  ③ THE DOCUMENT DOES NOT DO WHAT SCALING PAST n=1 REQUIRES. § 5 gives a BAR an operator must clear. The
     two things that actually go live the moment there is a second operator are absent: coherence across
     multiple writers to one compounding asset (link 4, free at n=1 and the hard problem at n=2), and WHO
     BEARS THE COST OF CAPTURE when the capturer is not the beneficiary. The second is a public-goods
     problem and Atlas has no mechanism for it.
  ④ THE TRIGGER BEING THREE THINGS SUGGESTS THE ARTIFACT IS THREE THINGS. Delegate → § 3, taste → § 4,
     craft → § 5. If ask ② resolves to three occasions, this is three artifacts and not one.

