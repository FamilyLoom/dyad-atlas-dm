how_this_was_tested: |
  ⭐ I stood up Atlas's own inbox and ran the full lifecycle, because you were right that I had never done it:
  live → snoozed → due → done, plus a decline, plus the re-close guard.

  ⛔ AND IT FOUND A DEFECT IN THE THING I HAD JUST SHIPPED, which is the argument for the lifecycle run more
  than anything I could assert. The archive is one level deeper than the queue, so `serves: ../projects/x.md`
  written at `inbox/` resolved to `inbox/projects/x.md` once moved — EVERY relative pointer in the frontmatter
  silently stopped resolving. `moveToArchive` now re-depths relative paths on the move and leaves URLs and
  absolute paths alone. ⚠️ If you had run a close before I did, you would have hit it.

