the_chain_it_rests_on: |
  One claim, stated so it can be attacked at the root rather than at the draft:

  A return differential comes from lower cost, higher value, faster cycles, a cornered resource, or
  compounding. The first four are purchasable or one-shot — a competitor buys the same tools. ∴ only
  compounding is defensible. Exactly two things compound non-purchasably in a firm: the knowledge it holds,
  and the judgment of the people in it. AI removes the first's decay (attrition + interpretation loss). It
  does NOT automatically compound the second — delegation erodes it.

  ⛔ THE ASYMMETRY THAT MAKES THE REST BIND: compounding is sign-agnostic. An incorrect corpus compounds
  faster than a correct one, because nothing slows it and every agent applies it uniformly.

the_draft: |
  TITLE: Who owns this judgment
  DECIDES: who owns a given judgment — the operator or an agent — and therefore where the hour goes.
  FIRES WHEN: ⛔ UNFILLED. See ask ②.

  § 1 — THE FIVE CONDITIONS. Serial, not parallel; any one at zero makes the other four worthless.
     1 captured   | agent    | cheap     | falsified by: a ruling from last month is nowhere in the corpus
     2 correct    | OPERATOR | expensive | falsified by: a rule fired on ground that had moved
     3 binds      | machine  | cheap     | falsified by: a rule all agree with that no reader convicts on
     4 coherent   | split    | mixed     | falsified by: two rules disagree and nothing says which wins
     5 verified   | OPERATOR | expensive | falsified by: accepted work he could not have checked himself
     ⭐ The cheap links are the ones agents made cheap. The expensive ones are the ones whose cost did not
     fall. The residual is DERIVED from that, not left over.

  § 2 — WHERE THE HOUR GOES. Effort flows to the cheap links: they are mechanical, legible, and they
     convict. Correctness enters ONLY through contact with the world — the session loop and the sweep loop
     propagate what is there and cannot add truth. ∴ world-contact rate is the rate limit on the whole
     system's correctness. Standing minimum: UNFILLED (Dharan's number).
     Falsified by: machinery-time ÷ world-contact-time rising across any three sessions.

  § 3 — THE DELEGATION CUT. ⭐ This is the core, and the part proposed for Peter.
     DELEGATE IFF THE OUTCOME IS OBSERVABLE AND ATTRIBUTABLE TO THE AGENT'S ACT. Both. Either missing →
     retained. The cut is not difficulty and not stakes — both recede as models improve. This one does not:
     model improvement does not manufacture attribution where none exists.
     Three breakers, each opening the loop elsewhere: one-shot breaks sampling · long-horizon breaks
     timeliness · confounded breaks attribution (worst — it teaches wrong lessons and feels like learning).
     Retained always: ① choice of telos/why — not a prediction, nothing to be right about ② whether the
     corpus matches reality — the corpus cannot verify itself ③ anything whose only evidence is the agent's
     own report ④ one-shot / long-horizon / confounded bets.
     For the retained class outcome feedback does not exist; the only channel is the reasoning recorded
     BEFORE the outcome.
     Falsified by: something delegated whose outcome could not later be attributed — or something retained
     that an agent could have closed the loop on.

  § 4 — WHAT "CAN TELL" MEANS. Taste = discriminating better from worse with no answer key. Five
     properties: discriminates · ordered · reliable · tracks the work not its maker · CALIBRATED (checked
     against a verdict from outside). ⛔ The first four without the fifth are precision without accuracy.
     ⚠️ Articulability is NOT one of the five — it is the separate property deciding whether any of it can
     enter the corpus at all. Articulate the ORDERING and its reason; a verdict alone captures nothing.
     Cues: confidence and evidence diverging · completeness claims · what is NOT mentioned · smooth
     agreement · the glue words (so / therefore / which means) · no failure mode named.
     ⛔ The erosion rule: spot-checking delegated work needs craft in the delegated domain — the craft
     delegation erodes. It is maintained by deliberately practising what he no longer needs to do, or lost.
     Falsified by: → `estate/ESTATE.md § Purpose` (b). NOT restated in the draft.

  § 5 — TRANSFERRING IT. Transfers: articulated orderings with reasons. Does not: tacit taste.
     Tests any operator must pass: ① their ordering on past work correlates with outcomes they did not see
     in advance ② they can state the reason for an ordering, not only the ordering ③ they find defects in
     agent output before the agent surfaces them ④ they refuse correctly — they can name where their
     authority ends ⑤ on retained-class decisions they record reasoning before outcomes.

  § 6 — NOT HERE. Derivation → session-log. The pairing's learnings → the learnings home. The mission →
     `company/`. The invariants and `§ Purpose` → `estate/`, pointed at, never copied.

